name: Supabase keepalive

# Supabase Freeプランは7日間APIアクセスが無いとプロジェクトが自動ポーズするため、
# 軽いSELECTを定期的に叩いてポーズを防ぐ。1週間の猶予に対して余裕を持たせるため毎日実行。
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/players?select=player_id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "status=$status"
          if [ "$status" -ge 300 ]; then
            echo "Supabase ping failed with status $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
